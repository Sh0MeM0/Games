name: Windows installer

on:
  push:
    tags:
      - 'shared-archive-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Test client
        working-directory: client
        run: npm test
      - name: Build Windows x64 installer
        working-directory: client
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder
        run: npm run dist:win -- --publish never --config.win.signAndEditExecutable=false
      - name: Installer checksum
        working-directory: client/release
        run: sha256sum SharedArchive-Setup-*.exe > SHA256SUMS.txt
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SharedArchive-Windows-x64
          path: |
            client/release/SharedArchive-Setup-*.exe
            client/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/shared-archive-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SharedArchive-Windows-x64
          path: release-assets
      - name: Publish download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.exe release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.exe release-assets/SHA256SUMS.txt \
              --verify-tag --title "Общий файловый архив ${RELEASE_TAG#shared-archive-v}" \
              --notes-file docs/RELEASE.md --prerelease
          fi
