name: Таксация Лайт — сборка Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'taksaciya/**'
      - '.github/workflows/taksaciya.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: taksaciya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Тесты ядра (эталоны оригинала)
        run: |
          node tests/test_engine.js
          python tests/test_engine_py.py
      - name: Сборка TaksaciyaLite.exe
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --onefile --windowed --name TaksaciyaLite --add-data "core/reference.json;core" --paths . desktop/taksaciya_app.py
      - name: Самопроверка exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/TaksaciyaLite.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - name: Комплект для скачивания
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/TaksaciyaLite.exe out/
          Copy-Item web/taksaciya.html out/Таксация-Лайт.html
          Copy-Item 'excel/Таксация-Лайт.xlsx' out/
          Copy-Item README.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: Taksaciya-Lite-Windows
          path: taksaciya/out
