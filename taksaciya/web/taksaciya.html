<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таксация Лайт</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* Layout: рабочий стол таксатора — сверху сводка итогов, слева вкладки, справа плотные ведомости. */
:root {
  --paper: #f3f5f1;        /* фон — бумага с зеленоватым оттенком */
  --surface: #ffffff;      /* таблицы и панели */
  --ink: #1b2620;          /* основной текст */
  --muted: #5b6a61;        /* подписи */
  --line: #d6ddd6;         /* линии таблиц */
  --accent: #2c6a4c;       /* хвойный зелёный */
  --accent-ink: #ffffff;
  --accent-soft: #e2efe7;
  --calc: #f6f8f4;         /* вычисляемые ячейки */
  --warn: #8a5300;
  --warn-soft: #fff3dc;
  --error: #b42318;
  --error-soft: #fdecea;
  --focus: #1f6feb;
  --font-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-num: "JetBrains Mono", Consolas, "Cascadia Mono", "Roboto Mono", monospace;
  --fs-xs: 0.75rem; --fs-s: 0.8125rem; --fs-m: 0.9375rem; --fs-l: 1.125rem; --fs-xl: 1.5rem;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111714; --surface: #172019; --ink: #e3ebe5; --muted: #9aaba1; --line: #2c3a32;
    --accent: #74c199; --accent-ink: #0c1510; --accent-soft: #1d3327; --calc: #141c17;
    --warn: #f0b860; --warn-soft: #33270f; --error: #ff8a80; --error-soft: #3a1a17; --focus: #6ea8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111714; --surface: #172019; --ink: #e3ebe5; --muted: #9aaba1; --line: #2c3a32;
  --accent: #74c199; --accent-ink: #0c1510; --accent-soft: #1d3327; --calc: #141c17;
  --warn: #f0b860; --warn-soft: #33270f; --error: #ff8a80; --error-soft: #3a1a17; --focus: #6ea8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--fs-m)/1.45 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- шапка со сводкой */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: var(--fs-l); font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.brand .obj { color: var(--muted); font-size: var(--fs-s); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36ch; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-left: auto; align-items: baseline; }
.sum-item { display: flex; flex-direction: column; min-width: 0; }
.sum-item .k { font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.02em; }
.sum-item .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--fs-m); font-weight: 600; }
.sum-item.main .v { font-size: var(--fs-l); color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: var(--fs-s);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.pill.err { border-color: var(--error); color: var(--error); background: var(--error-soft); }
.pill.ok { color: var(--muted); cursor: default; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 5px 12px;
  border-radius: var(--r); cursor: pointer; font-size: var(--fs-s); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--error); }
.btn.small { padding: 2px 8px; font-size: var(--fs-xs); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- каркас */
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 0; min-height: calc(100% - 100px); }
nav.tabs { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--paper); }
nav.tabs a { display: block; padding: 7px 10px; border-radius: var(--r); color: var(--ink); text-decoration: none; font-size: var(--fs-s); }
nav.tabs a:hover { background: var(--accent-soft); }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs .grp { margin: 12px 10px 4px; font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
main { min-width: 0; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
section.view { display: flex; flex-direction: column; gap: 14px; }
.view-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.view-head h2 { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.015em; }
.view-head p { margin: 0; color: var(--muted); font-size: var(--fs-s); max-width: 80ch; }
.hint { color: var(--muted); font-size: var(--fs-s); max-width: 90ch; margin: 0; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.tabs { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
  nav.tabs .grp { display: none; }
  nav.tabs a { white-space: nowrap; }
  .summary { margin-left: 0; }
}

/* ---------- формы */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.panel h3 { font-size: var(--fs-m); font-weight: 650; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.fields { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 8px 12px; align-items: center; }
.fields > * { min-width: 0; }
#main .fields input[data-pr], #main .fields input[data-prl] { max-width: 14ch; }
.fields label { color: var(--muted); font-size: var(--fs-s); }
.fields input, .fields select { width: 100%; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 4px 7px; min-width: 0; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.switch-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.switch-row:last-child { border-bottom: 0; }
.switch-row .lbl { flex: 1; min-width: 0; }
.switch-row .lbl small { display: block; color: var(--muted); font-size: var(--fs-xs); }
.kval { font-family: var(--font-num); font-weight: 600; min-width: 5.5ch; text-align: right; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; justify-self: start; }
.seg button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; font-size: var(--fs-s); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- таблицы ввода */
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: calc(100vh - 230px); }
table.grid { border-collapse: separate; border-spacing: 0; width: max-content; font-size: var(--fs-s); }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; vertical-align: middle; }
table.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 6px 6px; text-align: left; font-weight: 600;
  font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; }
table.grid thead th.calc { background: var(--calc); }
table.grid td input, table.grid td select { border: 0; border-radius: 0; background: transparent; width: 11ch; padding: 4px 6px; height: 28px; }
table.grid td select { width: auto; }
table.grid td input[type=checkbox] { width: 16px; height: 16px; }
table.grid td input:focus, table.grid td select:focus { background: var(--accent-soft); outline: none; box-shadow: inset 0 0 0 2px var(--focus); }
table.grid td.c { background: var(--calc); padding: 3px 6px; white-space: nowrap; color: var(--ink); }
table.grid td.c.wrap { white-space: normal; min-width: 18ch; }
table.grid td.n { text-align: right; }
table.grid td.rn { padding: 0 4px 0 6px; color: var(--muted); white-space: nowrap; font-family: var(--font-num); font-size: var(--fs-xs); }
table.grid tr.has-error td.rn { box-shadow: inset 3px 0 0 var(--error); color: var(--error); }
table.grid tr.has-error td { background-image: linear-gradient(var(--error-soft), var(--error-soft)); }
table.grid tr.has-warn td.rn { box-shadow: inset 3px 0 0 var(--warn); }
table.grid tr.removed td.act select { color: var(--error); font-weight: 600; }
table.grid tr.transpl td.act select { color: var(--accent); font-weight: 600; }
.row-tools { display: inline-flex; gap: 2px; margin-left: 4px; opacity: .35; }
tr:hover .row-tools, tr:focus-within .row-tools { opacity: 1; }
.row-tools button { border: 0; background: transparent; cursor: pointer; padding: 0 3px; font-size: 13px; line-height: 1; color: var(--muted); }
.row-tools button:hover { color: var(--accent); }
.row-tools button.del:hover { color: var(--error); }
table.grid td.col-wide input { width: 24ch; }
table.grid td.col-mid input { width: 12ch; }
table.grid td.col-narrow input { width: 7.5ch; }
.errtext { color: var(--error); font-size: var(--fs-xs); }
.grid-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- отчёты */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.report h3 { font-size: var(--fs-l); font-weight: 650; margin-bottom: 4px; }
.report .sub { color: var(--muted); font-size: var(--fs-s); margin-bottom: 12px; }
.report-scroll { overflow-x: auto; }
table.rep { border-collapse: collapse; font-size: var(--fs-s); width: 100%; }
table.rep th, table.rep td { border: 1px solid var(--line); padding: 4px 7px; text-align: left; vertical-align: top; }
table.rep th { background: var(--calc); font-weight: 600; font-size: var(--fs-xs); }
table.rep td.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.rep tr.tot td { background: var(--calc); }
table.rep tr.tot.big td { font-weight: 650; }
.report-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.notes { font-size: var(--fs-s); color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: var(--fs-s); }
.kv .num { text-align: right; }

/* ---------- сообщения */
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: var(--r); font-size: var(--fs-s); max-width: min(420px, calc(100vw - 32px)); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--r); font-size: var(--fs-s); }
.errlist { margin: 0; padding-left: 18px; font-size: var(--fs-s); color: var(--error); max-height: 220px; overflow: auto; }
.errlist a { color: inherit; }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: var(--fs-xs); background: var(--accent-soft); color: var(--accent); }
.tag.shrub { background: var(--warn-soft); color: var(--warn); }

@media print {
  .top, nav.tabs, .report-tools, .toolbar, .no-print, .toast { display: none !important; }
  body, main, .report { background: #fff !important; color: #000 !important; }
  .shell { display: block; }
  main { padding: 0; }
  section.view:not(.printing) { display: none !important; }
  .report { border: 0; padding: 0; break-inside: auto; }
  .report:not(.print-target) { display: none; }
  table.rep th, table.rep td { border-color: #000; }
  .table-wrap { max-height: none; overflow: visible; border: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><h1>Таксация Лайт</h1><span class="obj" id="obj-name"></span></div>
    <div class="summary" id="summary" aria-live="polite"></div>
  </div>
  <div class="toolbar">
    <button class="btn" type="button" id="btn-new">Новый проект</button>
    <button class="btn" type="button" id="btn-open" title="Файл проекта .json или файл программы ТАКСАЦИЯ-АВТО .xlsm">Открыть / импорт…</button>
    <button class="btn" type="button" id="btn-save">Сохранить проект</button>
    <button class="btn primary" type="button" id="btn-xlsx">Скачать ведомости Excel</button>
    <button class="btn" type="button" id="btn-example">Пример</button>
    <input type="file" id="file" accept=".json,.xlsm,.xlsx,application/json" hidden>
  </div>
  <div id="top-confirm"></div>
</header>
<div class="shell">
  <nav class="tabs" aria-label="Разделы">
    <span class="grp">Ввод данных</span>
    <a href="#object">Объект и настройки</a>
    <a href="#trees">Деревья и кустарники</a>
    <a href="#areas">Цветники, газоны</a>
    <span class="grp">Ведомости</span>
    <a href="#rep-existing">Существующих</a>
    <a href="#rep-removal">Удаляемых</a>
    <a href="#rep-transplant">Пересаживаемых</a>
    <a href="#rep-areas">Цветники и газоны</a>
    <a href="#rep-balance">Баланс и древесина</a>
    <span class="grp">Прочее</span>
    <a href="#library">Справочники</a>
    <a href="#help">Справка</a>
  </nav>
  <main id="main"></main>
</div>
<datalist id="dl-species"></datalist><datalist id="dl-reasons"></datalist><datalist id="dl-krepl"></datalist>
<div class="toast" id="toast" role="status" hidden></div>
<script>/*
 * Таксация Лайт — расчётное ядро.
 *
 * Независимая реализация расчётов программы «ТАКСАЦИЯ-АВТО 4.2» (файл .xlsm),
 * повторяющая её формулы. Возле каждого шага указано, какую ячейку или
 * формулу исходника он повторяет: «УДд!AR3», «СУЩд!O3» и т.п.
 * Справочники (породы, тарифы, таблицы объёмов, базовые величины) берутся
 * из reference.json, выгруженного из того же файла.
 *
 * Работает в браузере (глобальный объект TaksEngine) и в Node.js (module.exports).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.TaksEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // породы!H3:H7 — типы деревьев, породы!H9:H17 — типы кустарников
  var TREE_TYPES = ['хвой.', 'медл.', 'быст.', 'плод.', 'малоц.'];
  var SHRUB_TYPES = ['лиан.', 'хвой..', 'вечз.', 'крас.', 'медл..', 'быст..', 'плод..', 'ж.и.1', 'ж.и.2'];
  // породы!A2:A7
  var SP = {
    treePlot: 'Уч-к поросли дер.', shrubPlot: 'Уч-к поросли куст.',
    treePlotRoad: '*Уч-к поросли дер. у дорог', shrubPlotRoad: '*Уч-к поросли куст. у дорог',
    hedge1: 'Однорядная живая изгородь', hedge2: 'Двухрядная живая изгородь'
  };
  var NO_COMP = 'без компенcации';            // СУЩд!V15 (в оригинале латинская «c»)
  var NO_COMP_RE = /без\s*компен[сc]ации/i;
  var ERR_SHRUB_D = 'ОШИБКА: Ø куста = только "-"';   // СУЩд!V59
  var ERR_TREE_D = 'ОШИБКА: Ø дерева ≠ "-"';          // СУЩд!V62
  var LABELS = ['Д.хвой/вечз. ', 'Д.лис.м.р. ', 'Д.лис.б.р. ', 'К.древ.лиан. ', 'К.хвой/вечз. ',
    'К.лис.крас.цв. ', 'К.лис.м.р. ', 'К.л.б.р./плод. ', 'жив.изг.1р. ', 'жив.изг.2р. ']; // УДд!Z3
  var LABELS_G = ['Д.хв./вчз. ', 'Д.мр. ', 'Д.бр. ', 'К.дл. ', 'К.хв./вчз. ', 'К.кц. ', 'К.мр. ',
    'К.бр./пл. ', 'ж.изг.1р. ', 'ж.изг.2р. '];                                          // УДд!G3
  var UNITS = ['баз.в.', 'баз.в. (руб.)', 'руб.'];                                    // СУЩд!V3:V5

  // ---------------------------------------------------------------- utils
  function lc(s) { return String(s == null ? '' : s).toLowerCase(); }
  function isBlank(v) { return v === null || v === undefined || v === ''; }
  function eqi(a, b) { return lc(a) === lc(b); }               // сравнение «=» в Excel без учёта регистра
  function has(s, sub) { return String(s == null ? '' : s).indexOf(String(sub)) >= 0; }

  /** Округление как ROUND в Excel (половина — от нуля). */
  function xround(v, n) {
    var p = Math.pow(10, n || 0), s = v < 0 ? -1 : 1, x = Math.abs(v);
    return s * Math.round(Number((x * p).toPrecision(15))) / p;
  }
  function xroundup(v, n) {
    var p = Math.pow(10, n || 0), s = v < 0 ? -1 : 1, x = Math.abs(v);
    return s * Math.ceil(Number((x * p).toPrecision(15)) - 1e-9) / p;
  }
  /** Число → текст, как при склейке «&» в русском Excel (общий формат, запятая). */
  function xnum(v) {
    if (typeof v !== 'number') return v == null ? '' : String(v);
    if (!isFinite(v)) return String(v);
    var s = String(Number(v.toPrecision(15)));
    if (/e/i.test(s)) s = v.toFixed(12).replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }
  /** FIXED(v, n) — с разделителем тысяч (неразрывный пробел) и запятой. */
  function xfixed(v, n) {
    if (n === undefined) n = 2;
    var r = xround(v, n), neg = r < 0, s = Math.abs(r).toFixed(n), parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
    return (neg ? '-' : '') + parts.join(',');
  }
  /** VALUE(text) в русской локали: «12», «0,8», « 4», «50%». Возвращает NaN, если не число. */
  function ruValue(t) {
    if (typeof t === 'number') return t;
    var s = String(t == null ? '' : t).replace(/[\s\u00a0]/g, '');
    if (s === '') return NaN;
    var pct = false;
    if (s.charAt(s.length - 1) === '%') { pct = true; s = s.slice(0, -1); }
    if (!/^[-+]?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)) return NaN;
    var v = parseFloat(s.replace(',', '.'));
    return pct ? v / 100 : v;
  }
  function num(v) { var x = ruValue(v); return isNaN(x) ? 0 : x; }
  /** Число из поля ввода (кол-во, высота, площадь); пустое → null. */
  function inNum(v) {
    if (isBlank(v)) return null;
    var x = ruValue(v);
    return isNaN(x) ? null : x;
  }
  /** Текст ячейки так, как его видит формула (число → «20», «0,8»). */
  function cellText(v) { return typeof v === 'number' ? xnum(v) : (v == null ? '' : String(v)); }
  /** MATCH(v, thresholds, 1): индекс последнего порога ≤ v, иначе -1. */
  function matchApprox(arr, v) {
    var idx = -1;
    for (var i = 0; i < arr.length; i++) { if (arr[i] <= v) idx = i; else break; }
    return idx;
  }

  // ---------------------------------------------------------------- plots aggregation (УДд!AF2011:AJ2047)
  function plotGroups(rows, S, ref, shrub) {

      if (r.action !== 'в' || !r.coef) return;

      var key = r.coef.str;
      if (!groups[key]) { groups[key] = { str: key, k: r.coef.k, area: 0 }; order.push(key); }
      groups[key].area += r.qty;
    });
    var AG = shrub ? (S.compMap.plotShrub || '') : (S.compMap.plotTree || '');
    var total = 0;
    var list = order.map(function (key) {
      var g = groups[key], AH;
      if (S.money) AH = shrub ? (g.area > 9.99 ? ref.plots.shrubPlotPerM2 : ref.plots.shrubPlotSmall)

      else if (!shrub) {

      total += AF;

      stumpsT: { 1: BX[1] * 0.2, 2: BX[2] * 0.2, 3: BX[3] * 0.2, all: BX.all * 0.2 },
      shrubM3: ((BV.all * 1000) / dens) / 0.1,

      stemsByDiameter: stemsTable,
      // БАЛАНСЫ!K9:N10 (с округлением как в оригинале)
      table: {
        m3: [xround(BZ.all, 2), xround(BZ.all * 0.2, 2), xround(BY.all, 2), xround(((BV.all * 1000) / dens) / 0.1, 2)],
        t: [xround(BX.all, 3), xround(BX.all * 0.2, 2), xround(BW.all, 2), xround(BV.all, 2)]
      }
    };
  }

  // ---------------------------------------------------------------- transplant (ПЕРЕд)
  function ballSize(ref, info, height) {     // ПЕРЕд!G3 и Библ.ОРМ!K:P
    var lib = info.lib;
    if (!lib) return '';
    var h = typeof height === 'number' ? height : (isBlank(height) ? 0 : Infinity);
    var col = h > 5 ? 6 : h > 4 ? 5 : h > 2 ? 4 : h > 1.5 ? 3 : h > 0.99 ? 2 : 1;
    var F = lib.ballD, G = lib.ballH;
    if (col === 1) return 'Ø' + xnum(F == null ? '' : F) + '; h' + xnum(G == null ? '' : G);
    var k = ref._typeK[lib.type];
    if (!k) return '';
    var kd = k[(col - 2) * 2], kh = k[(col - 2) * 2 + 1];
    return 'Ø' + xnum(xround((F || 0) * kd, 1)) + '; h' + xnum(xround((G || 0) * kh, 1));
  }
  function workGroup(S, reason) {
    var g = '';
    (S.reasons || []).forEach(function (r) { if (!g && eqi(r.name, reason)) g = r.group || ''; });

  }
  function transplantTotals(rows, ref, S) {
    var tr = rows.filter(function (r) { return r.transplanted; });
    tr.forEach(function (r) {
      r.ball = ballSize(ref, r.info, r.height);
      r.group = workGroup(S, r.reason);
      r.trType = (r.action === 'п' && r.diamText !== '-' && !has(r.species, 'ч-к поросли')) ? r.N : '';   // ПЕРЕд!J3
    });
    function calc(list) {
      var s = function (pred) { return sum(list.filter(pred).map(function (r) { return r.qty; })); };
      var h1 = s(function (r) { return has(lc(r.species), 'днорядная живая изгород'); });
      var h2 = s(function (r) { return has(lc(r.species), 'вухрядная живая изгород'); });
      var shrubs = s(function (r) { return r.diamText === '-'; }) - h1 - h2;
      var trees = s(function () { return true; }) - shrubs - h1 - h2 -
        s(function (r) { return has(lc(r.species), 'ч-к поросли дер'); }) - s(function (r) { return has(lc(r.species), 'ч-к поросли куст'); });
      return { trees: trees, shrubs: shrubs, hedge1: h1, hedge2: h2 };
    }
    var tot = calc(tr);
    var byType = {};
    TREE_TYPES.forEach(function (ty) { byType[ty] = sum(tr.filter(function (r) { return r.trType === ty; }).map(function (r) { return r.qty; })); });
    tot.byType = byType;
    var groups = [];
    (S.reasons || []).forEach(function (rs) {
      if (!rs.group || groups.some(function (g) { return g.group === rs.group; })) return;
      var list = tr.filter(function (r) { return r.group === rs.group; });
      if (list.length) { var c = calc(list); c.group = rs.group; groups.push(c); }
    });
    tot.groups = groups;
    tot.rows = tr;
    return tot;
  }

  // ---------------------------------------------------------------- existing statement totals (СУЩд «Итого:»)
  function existingTotals(rows) {
    var s = function (pred) { return sum(rows.filter(pred).map(function (r) { return r.qty; })); };
    var plotsD = s(function (r) { return has(lc(r.species), 'ч-к поросли дер'); });
    var plotsK = s(function (r) { return has(lc(r.species), 'ч-к поросли куст'); });
    var dash = s(function (r) { return r.diamText === '-'; });
    var hedgesAll = s(function (r) { return has(lc(r.species), 'рядная живая'); });
    return {
      trees: s(function () { return true; }) - dash - plotsD,
      shrubs: dash - plotsK - hedgesAll,
      treePlots: plotsD, shrubPlots: plotsK,
      hedge1: s(function (r) { return has(lc(r.species), 'днорядная живая'); }),
      hedge2: s(function (r) { return has(lc(r.species), 'вухрядная живая'); })
    };
  }

  // ---------------------------------------------------------------- balance (БАЛАНСЫ!A2:H8)
  function balance(rows, ex, rmT, trT, S) {
    var kept = rows.filter(function (r) { return r.action === ''; });
    var keptOf = function (ty) {          // СУЩд!P26 / S26
      return sum(kept.filter(function (r) { return r.N === ty && r.qty > 0.5 && r.diamText !== '-'; }).map(function (r) { return r.qty; }));
    };
    var C = rmT.count;
    var total = { trees: ex.trees, treePlots: ex.treePlots, shrubs: ex.shrubs, shrubPlots: ex.shrubPlots, hedge1: ex.hedge1, hedge2: ex.hedge2 };
    var removed = { trees: C.treesC2035, treePlots: C.plotsD, shrubs: C.shrubsC2035, shrubPlots: C.plotsK, hedge1: C.h1, hedge2: C.h2,
      conif: C['хвой.'], fruit: C['плод.'] };
    removed.leafy = C.trees - removed.fruit - removed.conif;
    var trans = { trees: trT.trees, treePlots: 0, shrubs: trT.shrubs, shrubPlots: 0, hedge1: trT.hedge1, hedge2: trT.hedge2,
      conif: trT.byType['хвой.'], fruit: trT.byType['плод.'] };
    trans.leafy = trT.trees - trans.fruit - trans.conif;
    var keptB = {};
    ['trees', 'treePlots', 'shrubs', 'shrubPlots', 'hedge1', 'hedge2'].forEach(function (k) { keptB[k] = total[k] - trans[k] - removed[k]; });
    keptB.conif = keptOf('хвой.'); keptB.fruit = keptOf('плод.');
    keptB.leafy = keptB.trees - keptB.conif - keptB.fruit;
    total.conif = keptB.conif + trans.conif + removed.conif;
    total.fruit = keptB.fruit + trans.fruit + removed.fruit;
    total.leafy = keptB.leafy + trans.leafy + removed.leafy;
    return { kept: keptB, transplanted: trans, removed: removed, total: total, showPlots: S.showPlots, hedgePieces: S.hedgePieces };
  }

  // ---------------------------------------------------------------- flowers, lawns, grass (ЦвГаТр)
  function qualityK2(c) { return eqi(c, 'хор.') ? 1 : eqi(c, 'уд.') ? 0.75 : eqi(c, 'плох.') ? 0.5 : 0; }
  function areaSection(list, tariffs, projectedArea, projectedValue, S, base, leftoverStart) {
    var rows = [], Tprev = null, P15 = 0, Q15 = 0;
    (list || []).forEach(function (src, i) {
      var kind = src.kind;
      if (isBlank(kind) && isBlank(src.area) && isBlank(src.cond)) return;
      var r = { idx: i, src: src, kind: kind, errors: [] };
      r.area = inNum(src.area) || 0;
      r.cond = src.cond || '';
      r.transplant = !!src.transplant;
      r.reason = src.reason || '';
      r.group = workGroup(S, r.reason);
      var tariff = tariffs[kind];
      if (tariff === undefined) r.errors.push('вид не найден в справочнике');
      // T/U — зачёт проектируемой площади («метрами»)
      var T;
      if (leftoverStart !== undefined) {           // травяной покров: ЦвГаТр!T73
        T = Tprev === null ? r.area - leftoverStart : (Tprev > 0 ? r.area : r.area + Tprev);
      } else if (Tprev === null) T = (r.transplant ? 0 : r.area) - projectedArea;
      else T = Tprev > 0 ? r.area : (r.transplant ? Tprev : r.area + Tprev);
      Tprev = T;
      r.T = T;
      r.U = T < 0 ? r.area : (T === r.area ? 0 : r.area - T);
      r.F = r.transplant ? 'Пересадить (' + r.reason + ')' : '(' + r.reason + ') ' + (src.note || '');
      r.coef = isBlank(r.reason) ? null : coefficients(S, r.reason, src.kRepl);
      if (!r.coef && !r.transplant) r.errors.push('не указана причина');
      r.q = qualityK2(r.cond);
      if (r.transplant) { r.P = null; r.Q = null; r.E = '-'; }
      else if (!r.coef || tariff === undefined) { r.P = null; r.Q = null; r.E = 'ОШИБКА'; }
      else {
        var paid = S.flowerMode === 'стоимостью' ? r.area : Math.max(T, 0);
        var k = r.coef.k;
        r.P = paid * tariff * r.q * k[0] * k[1] * k[2] * k[3];
        r.Q = r.P * base;
        var O = unitText(r.P, r.Q, S);
        r.E = S.view === 'итог' ? O : O + ' = ' + xnum(r.area) + (S.flowerMode === 'стоимостью' ? '' : (r.U > 0 ? '-' + xnum(r.U) : '')) +
          'м² x' + xnum(tariff) + 'б.в. x' + xnum(r.q) + 'x' + xnum(k[0]) + 'х' + xnum(k[1]) + 'х' + xnum(k[2]) + 'х' + xnum(k[3]);
        P15 += r.P; Q15 += r.Q;
      }
      rows.push(r);
    });
    var R18 = S.flowerMode === 'стоимостью' ? projectedValue : 0;
    var R19 = P15 - R18, R20 = R19 > 0 ? R19 : 0;
    var allTransplanted = rows.length > 0 && rows.every(function (r) { return r.transplant; });
    var groups = [];
    (S.reasons || []).forEach(function (rs) {
      if (!rs.group || groups.some(function (g) { return g.group === rs.group; })) return;
      var lst = rows.filter(function (r) { return r.group === rs.group; });
      if (!lst.length) return;
      var share = P15 === 0 ? 0 : sum(lst.map(function (r) { return r.P || 0; })) * ((P15 - R18) / P15);
      groups.push({ group: rs.group, area: sum(lst.map(function (r) { return r.area; })), value: share });
    });
    return { rows: rows, area: sum(rows.map(function (r) { return r.area; })), P: P15, Q: Q15, projectedValue: R18,
      rest: R19, result: R20, allTransplanted: allTransplanted, groups: groups, lastT: Tprev };
  }
  function unitText(bv, rub, S) {          // ЦвГаТр!O2
    if (S.unit === 'баз.в.') return xfixed(bv, 0) + ' баз.в.';
    if (S.unit === 'руб.') return xfixed(rub) + ' руб.';
    return xfixed(bv, 0) + ' баз.в.(' + xfixed(rub) + ' руб.)';

  function computeAreas(project, ref, S, base) {
    var pr = project.projected || {};

  // ---------------------------------------------------------------- public compute
  /** Справочник с добавленными пользователем породами (project.customSpecies). */

  function mergedRef(project, ref) {

  function download(data, name, type) {

    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Файл «' + name + '» сохранён в загрузки браузера.');
  }
  function saveProject() {

  }
  function openFile(file) {
    var name = file.name.toLowerCase();
    var reader = new FileReader();
    if (/\.(xlsm|xlsx)$/.test(name)) {
      reader.onload = function () {
        var ab = reader.result;
        toast('Читаю «' + file.name + '»…');
        XlsxIO.readZip(ab, ['xl/workbook.xml', 'xl/_rels/workbook.xml.rels']).then(function (f0) {
          var need = TaksImport.neededFiles(f0).need;
          return XlsxIO.readZip(ab, need).then(function (f) { return Object.assign(f, f0); });
        }).then(function (files) {
          var r = TaksImport.parse(files, REF);
          project = normalize(r.project);
          project.trees.push(emptyRow(), emptyRow());
          recalc(); go('trees');
          toast('Импортировано строк: ' + r.count + '. ' + r.warnings.join(' '));
        }).catch(function (e) { toast('Не удалось импортировать: ' + e.message); });
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = function () {
        try {
          var p = JSON.parse(reader.result);
          if (!p.trees && !p.settings) throw new Error('это не файл проекта');
          project = normalize(p); recalc(); go(view); toast('Открыт проект «' + file.name + '».');
        } catch (e) { toast('Не удалось открыть: ' + e.message); }
      };
      reader.readAsText(file, 'utf-8');
    }
  }
  function copyText(text) {
    var done = function () { toast('Таблица скопирована — вставьте в Excel или Word.'); };
    try {
      navigator.clipboard.writeText(text).then(done, fallback);
    } catch (e) { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e2) { toast('Выделите таблицу и скопируйте вручную.'); }
      ta.remove();
    }
  }

  function refreshLists() {
    var names = REF.special.map(function (s) { return s.name; }).concat(REF.species.map(function (s) { return s.name; }))
      .concat((project.customSpecies || []).map(function (s) { return s.name; }).filter(Boolean));
    var seen = {};
    $('#dl-species').innerHTML = names.filter(function (n) { var k = n.toLowerCase(); if (seen[k]) return false; seen[k] = 1; return true; })
      .map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');
    $('#dl-reasons').innerHTML = project.settings.reasons.filter(function (r) { return r.name; }).map(function (r) { return '<option value="' + esc(r.name) + '"></option>'; }).join('');
    $('#dl-krepl').innerHTML = ['1', '2', '3', '4', '12', '24', '1234', E.NO_COMP].map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('');
  }
  function showErrors() {
    if (!res.errors.length) return;
    var html = '<div class="panel" id="err-panel"><h3>Ошибки в данных</h3><ul class="errlist">' + res.errors.slice(0, 300).map(function (e) {
      var where = e.section === 'trees' ? 'строка ' + (e.row + 1) + (e.no ? ' (№ ' + e.no + ')' : '') : ({ flowers: 'цветники', lawns: 'газоны', grass: 'трав. покров' }[e.section] + ', строка ' + (e.row + 1));
      return '<li><a href="#' + (e.section === 'trees' ? 'trees' : 'areas') + '" data-goto="' + e.section + ':' + e.row + '">' + esc(where) + '</a> — ' + esc(e.msg) + '</li>';
    }).join('') + '</ul><div class="grid-foot" style="margin-top:8px"><button class="btn" type="button" id="err-close">Закрыть</button></div></div>';
    var old = $('#err-panel'); if (old) old.remove();
    $('#main').insertAdjacentHTML('afterbegin', html);
    $('#err-close').onclick = function () { $('#err-panel').remove(); };
    $('#err-panel').addEventListener('click', function (ev) {
      var a = ev.target.closest('a[data-goto]'); if (!a) return;
      ev.preventDefault();
      var pr = a.dataset.goto.split(':');
      go(pr[0] === 'trees' ? 'trees' : 'areas'); location.hash = pr[0] === 'trees' ? 'trees' : 'areas';
      setTimeout(function () {
        var el = pr[0] === 'trees' ? document.getElementById('tr-' + pr[1] + '-species') : document.getElementById('ar-' + pr[0] + '-' + pr[1] + '-area');
        if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
      }, 30);
    });
  }

  // ------------------------------------------------------------------ boot
  function boot() {
    $('#btn-new').onclick = function () { askConfirm('#top-confirm', 'Начать новый проект? Несохранённые данные текущего проекта будут заменены.', function () { project = blankProject(); recalc(); go('object'); location.hash = 'object'; }); };
    $('#btn-example').onclick = function () { project = exampleProject(); recalc(); go('trees'); location.hash = 'trees'; toast('Загружен пример из файла ТАКСАЦИЯ-АВТО 4.2.'); };
    $('#btn-open').onclick = function () { $('#file').click(); };
    $('#file').onchange = function () { if (this.files[0]) openFile(this.files[0]); this.value = ''; };
    $('#btn-save').onclick = saveProject;
    $('#btn-xlsx').onclick = exportXlsx;
    $('#summary').onclick = function (ev) { if (ev.target.closest('#btn-errors')) showErrors(); };
    document.addEventListener('dragover', function (ev) { ev.preventDefault(); });
    document.addEventListener('drop', function (ev) { ev.preventDefault(); var f = ev.dataTransfer.files[0]; if (f) openFile(f); });
    refreshLists();
    recalc();
    var start = location.hash.slice(1);
    if (!VIEWS[start]) { try { start = localStorage.getItem(STORE_KEY + '-view') || 'trees'; } catch (e) { start = 'trees'; } }
    go(start);
    if (project._example) toast('Открыт пример (данные из исходного файла). Нажмите «Новый проект», чтобы начать свой.');
  }
  boot();
})();
</script>
