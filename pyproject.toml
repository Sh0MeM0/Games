[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-master"
version = "0.4.0"
description = "Offline PDF and raster images to editable CAD and Word converter with local neural OCR and translation"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "PyMuPDF==1.26.6",
    "ezdxf==1.4.4",
    "python-docx==1.2.0",
    "Pillow==12.3.0",
    "fonttools==4.60.1",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "PySide6-Essentials==6.8.3",
    "onnxruntime==1.31.1",
    "sentencepiece==0.2.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
pdf-master = "pdf2office.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

