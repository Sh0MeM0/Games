[project]
name = "shared-file-archive"
version = "1.0.0"
description = "Общий файловый архив"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]>=0.41,<1",
  "sqlalchemy>=2.0.46,<2.1",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic-settings>=2.12,<3",
  "PyJWT>=2.10.1,<3",
  "argon2-cffi>=25.1,<26",
  "python-multipart==0.0.32",
  "olefile==0.47",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
